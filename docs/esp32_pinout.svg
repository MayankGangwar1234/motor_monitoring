<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="900" viewBox="0 0 1400 900" role="img" aria-labelledby="title desc">
  <title id="title">ESP32 wiring for the 12 V DC motor monitoring model</title>
  <desc id="desc">ESP32 DevKit connections to MPU6050, INA219, OLED, DS18B20, TCRT5000, FR120N motor switch, buzzer, LEDs and optional START STOP buttons.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#07111f"/><stop offset="1" stop-color="#10243a"/></linearGradient>
    <linearGradient id="board" x1="0" y1="0" x2="0" y2="1"><stop stop-color="#245e73"/><stop offset="1" stop-color="#153b4f"/></linearGradient>
    <style>
      text{font-family:Inter,Arial,sans-serif;fill:#eaf3fd}.sub{fill:#91a8bf;font-size:16px}.pin{fill:#dcecff;font:600 16px monospace}.label{font-size:19px;font-weight:700}.wire{fill:none;stroke-width:3}.box{fill:#0d1d2d;stroke:#2d4b64;stroke-width:2}.note{fill:#ffc56b;font-size:15px}.safe{fill:#55d6a7;font-size:15px}
    </style>
  </defs>
  <rect width="1400" height="900" rx="18" fill="url(#bg)"/>
  <text x="52" y="56" font-size="31" font-weight="700">ESP32 DevKit V1 - 12 V DC Motor G23 Wiring</text>
  <text x="52" y="84" class="sub">Sensor logic is 3.3 V. The LM2596 supplies verified 5.0 V to ESP32 VIN. All low-voltage grounds are common.</text>

  <rect x="510" y="118" width="380" height="690" rx="28" fill="url(#board)" stroke="#4f93a8" stroke-width="3"/>
  <rect x="620" y="145" width="160" height="100" rx="8" fill="#101c29" stroke="#7890a4"/>
  <path d="M638 175h124M638 192h124M638 209h124" stroke="#a9bac8" opacity=".55"/>
  <text x="700" y="285" text-anchor="middle" font-size="25" font-weight="700">ESP32-WROOM-32</text>
  <text x="700" y="313" text-anchor="middle" class="sub">Acquisition + fault logic + Wi-Fi/MQTT</text>

  <g><circle cx="522" cy="360" r="7" fill="#32d6c5"/><text x="542" y="367" class="pin">GPIO21 - I2C SDA</text></g>
  <g><circle cx="522" cy="400" r="7" fill="#32d6c5"/><text x="542" y="407" class="pin">GPIO22 - I2C SCL</text></g>
  <g><circle cx="522" cy="460" r="7" fill="#ffb454"/><text x="542" y="467" class="pin">GPIO18 - DS18B20</text></g>
  <g><circle cx="522" cy="520" r="7" fill="#5ab0ff"/><text x="542" y="527" class="pin">GPIO27 - RPM pulse</text></g>
  <g><circle cx="522" cy="580" r="7" fill="#47d5b3"/><text x="542" y="587" class="pin">GPIO13 - START NO</text></g>
  <g><circle cx="522" cy="620" r="7" fill="#ff7f88"/><text x="542" y="627" class="pin">GPIO14 - STOP NC</text></g>

  <g><circle cx="878" cy="360" r="7" fill="#ff5e70"/><text x="858" y="367" text-anchor="end" class="pin">GPIO23 - FR120N IN</text></g>
  <g><circle cx="878" cy="420" r="7" fill="#dd75ff"/><text x="858" y="427" text-anchor="end" class="pin">GPIO25 - BUZZER</text></g>
  <g><circle cx="878" cy="480" r="7" fill="#55d6a7"/><text x="858" y="487" text-anchor="end" class="pin">GPIO32 - GREEN LED</text></g>
  <g><circle cx="878" cy="520" r="7" fill="#ffc56b"/><text x="858" y="527" text-anchor="end" class="pin">GPIO33 - YELLOW LED</text></g>
  <g><circle cx="878" cy="560" r="7" fill="#ff7f88"/><text x="858" y="567" text-anchor="end" class="pin">GPIO26 - RED LED</text></g>
  <g><circle cx="610" cy="790" r="7" fill="#ef5b5b"/><text x="585" y="765" class="pin">VIN / 5V</text><circle cx="700" cy="790" r="7" fill="#ff9c60"/><text x="680" y="765" class="pin">3V3</text><circle cx="790" cy="790" r="7" fill="#8595a6"/><text x="775" y="765" class="pin">GND</text></g>

  <rect class="box" x="42" y="130" width="390" height="130" rx="10"/>
  <text x="66" y="166" class="label">Shared I2C sensor/display bus</text>
  <text x="66" y="198" class="sub">MPU6050 0x68 + INA219 0x40 + OLED 0x3C</text>
  <text x="66" y="228" class="sub">SDA - GPIO21  |  SCL - GPIO22  |  VCC - 3V3</text>
  <path class="wire" stroke="#32d6c5" d="M432 205H470V360H522M470 400H522"/>

  <rect class="box" x="42" y="310" width="390" height="120" rx="10"/>
  <text x="66" y="346" class="label">DS18B20 casing temperature</text>
  <text x="66" y="378" class="sub">DATA - GPIO18  |  VDD - 3V3  |  GND - GND</text>
  <text x="66" y="407" class="note">4.7 kohm pull-up from DATA to 3V3</text>
  <path class="wire" stroke="#ffb454" d="M432 372H478V460H522"/>

  <rect class="box" x="42" y="480" width="390" height="120" rx="10"/>
  <text x="66" y="516" class="label">TCRT5000 reflective RPM sensor</text>
  <text x="66" y="548" class="sub">DO - GPIO27  |  VCC - 3V3  |  GND - GND</text>
  <text x="66" y="577" class="note">One wheel mark = one pulse/revolution</text>
  <path class="wire" stroke="#5ab0ff" d="M432 542H478V520H522"/>

  <rect class="box" x="42" y="650" width="390" height="130" rx="10"/>
  <text x="66" y="686" class="label">Optional physical controls</text>
  <text x="66" y="718" class="sub">START NO: GPIO13 to GND, pressed LOW</text>
  <text x="66" y="746" class="sub">STOP NC: GPIO14 to GND, healthy LOW</text>
  <text x="66" y="771" class="safe">Enable in config only after both are installed.</text>
  <path class="wire" stroke="#47d5b3" d="M432 712H475V580H522"/>
  <path class="wire" stroke="#ff7f88" d="M432 742H488V620H522"/>

  <rect class="box" x="968" y="130" width="390" height="145" rx="10"/>
  <text x="992" y="166" class="label">FR120N motor ON/OFF module</text>
  <text x="992" y="198" class="sub">Control IN - GPIO23  |  control GND - common GND</text>
  <text x="992" y="228" class="sub">10 kohm pull-down from GPIO23 to GND</text>
  <text x="992" y="255" class="note">HIGH = motor ON; LOW/reset/trip = motor OFF</text>
  <path class="wire" stroke="#ff5e70" d="M878 360H930V205H968"/>

  <rect class="box" x="968" y="330" width="390" height="150" rx="10"/>
  <text x="992" y="366" class="label">Local alerts</text>
  <text x="992" y="398" class="sub">Active buzzer IN - GPIO25</text>
  <text x="992" y="427" class="sub">Green/yellow/red - GPIO32/33/26</text>
  <text x="992" y="456" class="note">Each LED uses its own 330 ohm resistor</text>
  <path class="wire" stroke="#dd75ff" d="M878 420H936V390H968"/>
  <path class="wire" stroke="#55d6a7" d="M878 480H948V432H968"/>
  <path class="wire" stroke="#ffc56b" d="M878 520H950V442H968"/>
  <path class="wire" stroke="#ff7f88" d="M878 560H952V452H968"/>

  <rect class="box" x="968" y="540" width="390" height="190" rx="10"/>
  <text x="992" y="576" class="label">Power and hard-wired protection</text>
  <text x="992" y="608" class="sub">12 V adapter - E-stop NC - 2 A fuse - INA219</text>
  <text x="992" y="638" class="sub">LM2596 OUT 5.0 V - ESP32 VIN/5V</text>
  <text x="992" y="668" class="sub">1N5408 across motor: stripe to motor positive</text>
  <text x="992" y="698" class="safe">E-stop and fuse work without ESP32 software.</text>

  <text x="52" y="855" class="note">Disconnect the 12 V adapter before wiring changes. Do not power ESP32 from USB and buck simultaneously unless the exact board documents a safe power path.</text>
</svg>
