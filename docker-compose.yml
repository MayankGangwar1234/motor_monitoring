services:
  mosquitto:
    image: eclipse-mosquitto:2
    ports:
      - "1883:1883"
      - "9001:9001"
    volumes:
      - ./mosquitto/config:/mosquitto/config:ro
      - mosquitto_data:/mosquitto/data

  mongo:
    image: mongo:7
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"]
      interval: 10s
      timeout: 5s
      retries: 10

  backend:
    build: ./backend
    environment:
      MQTT_URL: mqtt://mosquitto:1883
      MONGODB_URL: mongodb://mongo:27017
      MONGODB_DB: motor_monitoring
      PORT: 3000
      CORS_ORIGIN: http://localhost:8080,http://localhost:5173
      ALLOW_HTTP_INGEST: "true"
      REQUIRE_MONGO: "true"
    ports:
      - "3000:3000"
    depends_on:
      mongo:
        condition: service_healthy
      mosquitto:
        condition: service_started
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      args:
        VITE_API_URL: http://localhost:3000
    ports:
      - "8080:80"
    depends_on:
      - backend
    restart: unless-stopped

volumes:
  mongo_data:
  mosquitto_data:

